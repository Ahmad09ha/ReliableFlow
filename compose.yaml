services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_only
      POSTGRES_DB: postgres
    ports:
      # Separate from a developer's local PostgreSQL server on 5432.
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create_databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:4-management
    hostname: reliableflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: demo
      RABBITMQ_DEFAULT_PASS: demo_only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  ordering:
    build:
      context: .
      dockerfile: samples/Ordering.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Orders: Host=postgres;Port=5432;Database=orders_db;Username=demo;Password=demo_only
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: demo
      RabbitMQ__Password: demo_only
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  inventory:
    build:
      context: .
      dockerfile: samples/Inventory.Service/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Inventory: Host=postgres;Port=5432;Database=inventory_db;Username=demo;Password=demo_only
      RabbitMQ__Host: rabbitmq
      RabbitMQ__User: demo
      RabbitMQ__Password: demo_only
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  postgres_data:
  rabbit_data:
